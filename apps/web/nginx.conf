server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Кирилл текст UTF-8 байхыг баталгаажуулна
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Hash-тай асет — удаан кэш
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker болон manifest кэшлэгдэх ёсгүй — шинэчлэлт шууд хүрнэ
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # API-г ижил origin дээр дамжуулна (VITE_API_BASE_URL хоосон үед)
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Тайлангийн .docx байршуулалт (≤10MB)
        client_max_body_size 12m;
    }

    # SPA — бүх зам index.html руу
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Аюулгүй байдлын толгойнууд
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Камер (QR уншигч) зөвхөн өөрийн origin дээр
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
}
